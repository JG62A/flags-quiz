<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c3d4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Флаги" />
    <meta name="description" content="Квиз по флагам стран для iPad. Без рекламы и регистрации." />
    <title>Флаги стран</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section id="start-screen" class="screen is-active" aria-label="Выбор режима">
        <div class="start-card">
          <p class="eyebrow">PWA-квиз</p>
          <h1>Угадай флаг</h1>
          <p class="lead">Название страны, 4 флага. Можно прослушать произношение.</p>
          <div class="mode-grid">
            <button class="mode-btn" data-mode="europe" type="button">
              <span class="mode-title">Европа</span>
              <span class="mode-sub">Страны Европы</span>
            </button>
            <button class="mode-btn" data-mode="world" type="button">
              <span class="mode-title">Весь мир</span>
              <span class="mode-sub">Европа и другие страны</span>
            </button>
          </div>
        </div>
      </section>

      <section id="quiz-screen" class="screen" hidden aria-label="Вопрос">
        <header class="quiz-bar">
          <p id="mode-label" class="mode-chip">Европа</p>
          <p id="score" class="score">0 / 10</p>
        </header>

        <div class="prompt">
          <p class="prompt-label">Какой флаг у этой страны?</p>
          <div class="country-row">
            <h2 id="country-name">Страна</h2>
            <button id="speak-btn" class="speak-btn" type="button" aria-label="Произнести название страны">
              <span aria-hidden="true">🔊</span>
            </button>
          </div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>

        <div id="options" class="flag-options"></div>
      </section>

      <section id="result-screen" class="screen" hidden aria-label="Результат">
        <div class="result-card">
          <p class="eyebrow">Итог</p>
          <h2 id="result-title">Отличная игра!</h2>
          <p id="result-score" class="result-score">0 / 10</p>
          <p id="result-text" class="lead"></p>
          <button id="replay-btn" class="primary-btn" type="button">Играть ещё раз</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
